<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:type" content="website">

  <meta property="og:title" content="NOVA – Coming Soon">
  <meta property="og:description" content="Hier entsteht gerade etwas Großes. Trag dich ein und sei beim Start als Erstes dabei.">
  <meta property="og:url" content="https://nilstset5-oss.github.io/Comming-Soon/">
  <meta property="og:image" content="https://nilstset5-oss.github.io/Comming-Soon/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NOVA – Coming Soon">
  <meta name="twitter:description" content="Hier entsteht gerade etwas Großes. Trag dich ein und sei beim Start als Erstes dabei.">
  <meta name="twitter:image" content="https://nilstset5-oss.github.io/Comming-Soon/assets/img/og-image.jpg">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"NOVA","url":"https://nilstset5-oss.github.io/Comming-Soon/","description":"Hier entsteht gerade etwas Großes. Trag dich ein und sei beim Start als Erstes dabei."}</script>
  <!-- SEO:END -->
  <link rel="icon" href="assets/img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/live.css">
  <link rel="stylesheet" href="assets/css/studio.css">
</head>
<body class="mode-soon">
  <div class="nebula" id="nebula" aria-hidden="true"></div>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="planets" id="planets" aria-hidden="true">
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="planet planet-3"></div>
  </div>
  <div class="glow" aria-hidden="true"></div>

  <button class="rocket" id="rocket" type="button" aria-label="Rakete" hidden>
    <svg viewBox="0 0 40 64" aria-hidden="true">
      <defs>
        <linearGradient id="rk-body" x1="0" x2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#b9c0e8"/>
        </linearGradient>
        <linearGradient id="rk-flame" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6b0"/>
          <stop offset=".45" stop-color="#ffb347"/>
          <stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="flame" d="M13 46 Q20 74 27 46 Z" fill="url(#rk-flame)"/>
      <path d="M8 36 L2 48 L12 44 Z" fill="var(--a3)"/>
      <path d="M32 36 L38 48 L28 44 Z" fill="var(--a3)"/>
      <path d="M20 2 C31 12 32 30 28 46 L12 46 C8 30 9 12 20 2 Z" fill="url(#rk-body)"/>
      <circle cx="20" cy="22" r="5.5" fill="var(--a2)" stroke="#2a2f55" stroke-width="2"/>
      <path d="M20 2 C24 6 26.5 10 27.6 14 L12.4 14 C13.5 10 16 6 20 2 Z" fill="var(--a1)"/>
    </svg>
  </button>

  <div class="header" id="header">
    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
      <button class="banner-close" id="banner-close" type="button" aria-label="Banner schließen">×</button>
    </div>
    <div class="topbar">
      <a class="brand" href="#top" id="brand">
        <span class="brand-logo" id="brand-logo" aria-hidden="true">🚀</span>
        <span class="brand-name" id="brand-name"></span>
      </a>
      <nav class="nav only-live" id="nav" aria-label="Navigation"></nav>
      <div class="controls">
        <button class="icon-btn menu-btn only-live" id="btn-menu" type="button" aria-expanded="false" aria-controls="nav">☰</button>
        <button class="icon-btn" id="btn-game" type="button">🎮</button>
        <button class="icon-btn" id="btn-sound" type="button" aria-pressed="false">🔇</button>
        <div class="lang-switch" role="group" aria-label="Sprache / Language">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </div>

  <main id="top">
    <!-- ===================== HERO ===================== -->
    <section class="hero" id="hero">
      <span class="badge"><span class="dot" aria-hidden="true"></span><span id="badge-text"></span></span>

      <h1 class="title gradient-text" id="title"></h1>

      <p class="lead" id="lead"></p>

      <!-- Coming Soon: Countdown -->
      <div class="countdown-wrap only-soon" id="countdown-wrap">
        <div class="countdown" id="countdown" role="timer" aria-live="off"></div>
        <div class="launch-meta">
          <span id="launch-date"></span>
          <button class="link-btn" id="btn-calendar" type="button">📅 <span data-ui="calendar"></span></button>
          <button class="link-btn" id="btn-share" type="button">🔗 <span data-ui="share"></span></button>
        </div>
      </div>

      <!-- Live: Buttons -->
      <div class="cta-row only-live" id="cta-row">
        <a class="btn btn-primary" id="cta-main" href="#features"></a>
        <button class="btn btn-ghost" id="cta-game" type="button" data-ui="playNow"></button>
      </div>

      <!-- Coming Soon: Anmeldung -->
      <form class="notify only-soon signup-form" id="signup-hero" novalidate>
        <label class="sr-only" for="email-hero" data-ui="emailLabel"></label>
        <input id="email-hero" name="email" type="email" autocomplete="email" required>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn btn-primary" type="submit"></button>
      </form>
      <p class="form-msg only-soon" role="status" aria-live="polite" data-msg-for="signup-hero"></p>

      <p class="hint" id="hint"></p>

      <a class="scroll-cue" href="#features" id="scroll-cue">
        <span class="mouse" aria-hidden="true"></span>
        <span data-ui="scroll"></span>
      </a>
    </section>

    <!-- ===================== FEATURES ===================== -->
    <section class="section" id="features">
      <div class="section-head reveal">
        <h2 class="section-title gradient-text" id="features-title"></h2>
      </div>
      <div class="features-grid" id="features-grid"></div>
    </section>

    <!-- ===================== ÜBER UNS (live) ===================== -->
    <section class="section only-live" id="about">
      <div class="section-head reveal">
        <h2 class="section-title gradient-text" id="about-title"></h2>
      </div>
      <div class="about reveal" id="about-body">
        <p class="about-text" id="about-text"></p>
        <img class="about-img" id="about-img" alt="" hidden>
      </div>
    </section>

    <!-- ===================== ZAHLEN (live) ===================== -->
    <section class="section only-live" id="stats">
      <div class="stats" id="stats-grid"></div>
    </section>

    <!-- ===================== ROADMAP ===================== -->
    <section class="section" id="roadmap">
      <div class="section-head reveal">
        <h2 class="section-title gradient-text" id="roadmap-title"></h2>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- ===================== SPIEL ===================== -->
    <section class="section" id="game-section">
      <div class="card game-card reveal">
        <div class="game-emoji" aria-hidden="true">🛸</div>
        <div>
          <h3 id="game-title"></h3>
          <p id="game-text"></p>
          <p class="game-best" id="game-best" hidden></p>
        </div>
        <button class="btn btn-primary" id="game-start-btn" type="button" data-ui="playNow"></button>
      </div>
    </section>

    <!-- ===================== FAQ ===================== -->
    <section class="section" id="faq">
      <div class="section-head reveal">
        <h2 class="section-title gradient-text" id="faq-title"></h2>
      </div>
      <div class="faq" id="faq-list"></div>
    </section>

    <!-- ===================== NEWSLETTER (live) ===================== -->
    <section class="section only-live" id="newsletter">
      <div class="card newsletter reveal">
        <h2 class="gradient-text" id="newsletter-title"></h2>
        <p id="newsletter-text"></p>
        <form class="notify signup-form" id="signup-live" novalidate>
          <label class="sr-only" for="email-live" data-ui="emailLabel"></label>
          <input id="email-live" name="email" type="email" autocomplete="email" required>
          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn-primary" type="submit"></button>
        </form>
        <p class="form-msg" role="status" aria-live="polite" data-msg-for="signup-live"></p>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer">
    <div class="social" id="social"></div>
    <p class="footer-text" id="footer-text"></p>
    <div class="footer-meta">
      <span>© <span id="year"></span> <span id="footer-brand"></span></span>
      <span id="visitors" hidden></span>
      <span id="eggs-count" hidden></span>
      <a href="#admin" id="admin-link">🔒 <span data-ui="admin"></span></a>
    </div>
  </footer>

  <!-- ===================== SPIEL-FENSTER ===================== -->
  <div class="game-modal" id="game" role="dialog" aria-modal="true" aria-labelledby="game-dialog-title" hidden>
    <canvas id="game-canvas"></canvas>
    <button class="icon-btn game-pause" id="game-pause" type="button" aria-label="Pause">⏸</button>
    <button class="icon-btn game-close" id="game-close" type="button" aria-label="Schließen">✕</button>
    <div class="card game-overlay" id="game-overlay"></div>
  </div>

  <button class="studio-fab" id="studio-fab" type="button" hidden>✏️ <span data-ui="studio"></span></button>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Einstellungen: auf GitHub Pages leer (dann gilt config.json), im Artifact hier eingebettet -->
  <script type="application/json" id="cs-config"></script>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/space.js"></script>
  <script src="assets/js/game.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/live.js"></script>
  <script src="assets/js/images.js"></script>
  <script src="assets/js/studio.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
