name: ESP32 Studio

on:
  push:
    paths:
      - "esp32-studio/**"
      - ".github/workflows/esp32-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Boardpaket installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list

      - name: Kompilieren
        run: |
          set -e
          mkdir -p out
          for target in \
            "esp32|esp32:esp32:esp32" \
            "esp32s2-usb|esp32:esp32:esp32s2:CDCOnBoot=cdc" \
            "esp32s3|esp32:esp32:esp32s3" \
            "esp32s3-usb|esp32:esp32:esp32s3:CDCOnBoot=cdc" \
            "esp32c3|esp32:esp32:esp32c3" \
            "esp32c3-usb|esp32:esp32:esp32c3:CDCOnBoot=cdc" \
            "esp32c6-usb|esp32:esp32:esp32c6:CDCOnBoot=cdc"
          do
            name="${target%%|*}"
            fqbn="${target##*|}"
            echo "::group::$name ($fqbn)"
            arduino-cli compile --fqbn "$fqbn" --warnings default \
              --output-dir "build/$name" esp32-studio/firmware/ESP32Studio
            cp "build/$name/ESP32Studio.ino.merged.bin" "out/esp32studio-$name.bin"
            echo "::endgroup::"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: esp32studio-firmware
          path: out/*.bin

  firmware-core2:
    name: Firmware mit Boardpaket 2.x pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Boardpaket 2.0.17 installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Kompilieren
        run: |
          set -e
          for fqbn in esp32:esp32:esp32 esp32:esp32:esp32c3 esp32:esp32:esp32s3; do
            echo "::group::$fqbn"
            arduino-cli compile --fqbn "$fqbn" --warnings default esp32-studio/firmware/ESP32Studio
            echo "::endgroup::"
          done

  windows-app:
    name: Windows-App bauen
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r esp32-studio/app/requirements.txt pyinstaller

      - name: Selbsttest (Python)
        run: python esp32-studio/app/esp32_studio.py --selftest

      - name: EXE bauen
        working-directory: esp32-studio/app
        run: pyinstaller --noconfirm --onefile --windowed --name ESP32Studio --collect-all esptool --collect-all segno esp32_studio.py

      - name: Selbsttest (EXE)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath esp32-studio/app/dist/ESP32Studio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
          "EXE-Selbsttest ok"

      - uses: actions/download-artifact@v4
        with:
          name: esp32studio-firmware
          path: package/ESP32Studio/firmware/bin

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          Copy-Item esp32-studio/app/dist/ESP32Studio.exe package/ESP32Studio/
          New-Item -ItemType Directory -Force package/ESP32Studio/firmware/ESP32Studio | Out-Null
          Copy-Item esp32-studio/firmware/ESP32Studio/* package/ESP32Studio/firmware/ESP32Studio/
          Copy-Item esp32-studio/README.md package/ESP32Studio/LIESMICH.md
          Get-ChildItem -Recurse package | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ESP32Studio-Windows
          path: package/
